<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoFoot Live — Mur d'écrans 6×6, signé Faye</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--g:#00c46a;--red:#e84040;--gold:#f0a500;--bg:#040810;--surf:#0a1520;--surf2:#111e2e;--bord:#1a2a3a;--txt:#eaf0f7;--txt2:#6a8899}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);height:100vh;overflow:hidden}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,196,106,.4)}70%{box-shadow:0 0 0 6px rgba(0,196,106,0)}}

/* HEADER */
.hdr{background:var(--surf);border-bottom:1px solid var(--bord);height:44px;display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
.brand-name{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:#fff}
.brand-name span{color:var(--g)}
.brand-sub{font-size:9px;font-style:italic;color:var(--gold)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.live-badge{background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px;animation:blink 2s infinite}
.hdr-btn{background:var(--surf2);border:1px solid var(--bord);color:var(--txt2);font-size:10px;padding:4px 10px;border-radius:4px;cursor:pointer;transition:.13s;font-family:'Inter',sans-serif}
.hdr-btn:hover{border-color:var(--g);color:var(--g)}
.hdr-btn.on{background:rgba(0,196,106,.1);border-color:var(--g);color:var(--g)}
.grid-selector{display:flex;gap:3px;align-items:center}
.gs-btn{background:var(--surf2);border:1px solid var(--bord);color:var(--txt2);font-size:10px;padding:3px 8px;border-radius:3px;cursor:pointer;transition:.13s}
.gs-btn:hover,.gs-btn.on{background:rgba(0,196,106,.1);border-color:var(--g);color:var(--g)}
.stream-input{background:var(--surf2);border:1px solid var(--bord);color:var(--txt);font-size:11px;padding:5px 10px;border-radius:4px;width:240px;outline:none}
.stream-input:focus{border-color:var(--g)}
.stream-input::placeholder{color:var(--txt2)}
.add-btn{background:var(--g);border:none;color:#020e08;font-size:11px;font-weight:600;padding:5px 12px;border-radius:4px;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap}
.add-btn:hover{background:#00d975}

/* LAYOUT PRINCIPAL */
.main{display:flex;height:calc(100vh - 44px)}

/* SIDEBAR MATCHS */
.sidebar{width:200px;flex-shrink:0;background:var(--surf);border-right:1px solid var(--bord);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--bord) transparent}
.sb-ttl{font-size:8px;font-weight:700;color:var(--txt2);letter-spacing:2px;text-transform:uppercase;padding:8px 10px 3px}
.match-item{padding:7px 10px;cursor:pointer;transition:.12s;border-left:2px solid transparent;border-bottom:1px solid rgba(26,42,58,.5)}
.match-item:hover{background:var(--surf2)}
.match-item.live-item{border-left-color:var(--g)}
.match-item.in-grid{background:rgba(0,196,106,.05);border-left-color:var(--g)}
.mi-league{font-size:8px;color:var(--txt2);margin-bottom:2px}
.mi-teams{font-size:10px;font-weight:500;color:var(--txt);line-height:1.3}
.mi-score{font-family:'Syne',sans-serif;font-size:13px;font-weight:800;color:var(--g);margin-top:1px}
.mi-footer{display:flex;align-items:center;gap:4px;margin-top:3px}
.mi-live{font-size:8px;color:var(--g);display:flex;align-items:center;gap:2px}
.mi-live i{width:4px;height:4px;border-radius:50%;background:var(--g);animation:blink 1s infinite;display:block}
.mi-add{background:rgba(0,196,106,.1);border:1px solid rgba(0,196,106,.25);color:var(--g);font-size:8px;padding:1px 6px;border-radius:3px;margin-left:auto;cursor:pointer;font-family:'Inter',sans-serif}
.mi-add:hover{background:rgba(0,196,106,.25)}
.mi-add.added{background:rgba(0,196,106,.2);cursor:default}

/* GRILLE VIDÉOS */
.video-grid-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.grid-toolbar{background:var(--surf);border-bottom:1px solid var(--bord);padding:5px 10px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.gt-info{font-size:10px;color:var(--txt2)}
.gt-info span{color:var(--g);font-weight:600}
.clear-btn{background:none;border:1px solid rgba(232,64,64,.3);color:var(--red);font-size:9px;padding:2px 8px;border-radius:3px;cursor:pointer;margin-left:auto}
.clear-btn:hover{background:rgba(232,64,64,.1)}

.video-grid{flex:1;display:grid;gap:2px;padding:2px;overflow:hidden}

/* CELLULE VIDÉO */
.vcell{background:#000;border-radius:4px;overflow:hidden;position:relative;border:1px solid var(--bord);cursor:pointer;transition:.15s}
.vcell:hover{border-color:rgba(0,196,106,.5);z-index:2}
.vcell.active{border-color:var(--g);border-width:2px;animation:pulse 2s infinite}
.vcell.empty{background:var(--surf);border:1px dashed var(--bord);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:default}
.vcell.empty:hover{border-color:rgba(0,196,106,.3)}
.empty-icon{font-size:20px;opacity:.4}
.empty-txt{font-size:9px;color:var(--txt2);text-align:center;padding:0 8px}
.empty-num{font-family:'Syne',sans-serif;font-size:22px;color:var(--bord);font-weight:800}

/* Vidéo dans la cellule */
.vcell video{width:100%;height:100%;object-fit:cover;display:block}
.vcell iframe{width:100%;height:100%;border:none;display:block}

/* Overlay info sur la cellule */
.cell-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent, rgba(0,0,0,.9));padding:4px 6px 5px;pointer-events:none}
.cell-teams{font-size:9px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-score{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;color:var(--g);display:inline}
.cell-min{font-size:8px;color:var(--g);margin-left:4px}
.cell-live{background:var(--red);color:#fff;font-size:7px;font-weight:700;padding:1px 4px;border-radius:2px;animation:blink 1.5s infinite;display:inline-block}

/* Top-bar dans cellule */
.cell-topbar{position:absolute;top:0;left:0;right:0;background:linear-gradient(rgba(0,0,0,.7),transparent);padding:4px 6px;display:flex;align-items:center;gap:4px;pointer-events:none}
.cell-ch{font-size:8px;color:var(--gold);font-weight:600}

/* Boutons cellule (hover) */
.cell-actions{position:absolute;top:4px;right:4px;display:none;gap:3px}
.vcell:hover .cell-actions{display:flex}
.ca-btn{background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:9px;padding:2px 5px;border-radius:3px;cursor:pointer;transition:.13s;pointer-events:all}
.ca-btn:hover{background:rgba(0,0,0,.95);border-color:var(--g)}
.ca-btn.del:hover{border-color:var(--red);color:var(--red)}

/* Cellule loading */
.cell-loading{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.spinner{width:28px;height:28px;border:2px solid var(--bord);border-top-color:var(--g);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:9px;color:var(--txt2)}

/* Cellule sélectionnée — grande vue */
.vcell.focused{position:fixed!important;top:44px;left:200px;right:0;bottom:0;z-index:100;border-radius:0;border-color:var(--g)!important;border-width:2px!important}

/* Sous-titres dans cellule */
.cell-subtitle{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;font-size:12px;padding:4px 12px;border-radius:4px;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;display:none;text-align:center}
.cell-subtitle.show{display:block}

/* Panel URLs rapides */
.quick-urls{background:var(--surf2);border-top:1px solid var(--bord);padding:6px 10px;display:flex;gap:6px;overflow-x:auto;flex-shrink:0;align-items:center}
.qu-ttl{font-size:9px;color:var(--txt2);white-space:nowrap;flex-shrink:0}
.qu-btn{background:var(--surf);border:1px solid var(--bord);color:var(--txt2);font-size:9px;padding:3px 9px;border-radius:3px;cursor:pointer;white-space:nowrap;transition:.13s;flex-shrink:0}
.qu-btn:hover{border-color:var(--g);color:var(--g)}

/* MODAL stream URL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;display:none;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--surf);border:1px solid var(--bord);border-radius:10px;padding:20px;width:460px;max-width:95vw}
.modal h3{font-family:'Syne',sans-serif;font-size:17px;margin-bottom:10px;color:var(--txt)}
.modal label{font-size:10px;color:var(--txt2);display:block;margin-bottom:4px;margin-top:10px}
.modal input,.modal textarea{width:100%;background:var(--surf2);border:1px solid var(--bord);color:var(--txt);font-size:11px;padding:7px 10px;border-radius:5px;outline:none;font-family:'Inter',sans-serif}
.modal input:focus,.modal textarea:focus{border-color:var(--g)}
.modal textarea{min-height:70px;resize:vertical;font-family:monospace}
.modal-btns{display:flex;gap:8px;margin-top:14px}
.btn-g{background:var(--g);border:none;color:#020e08;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;padding:8px 16px;border-radius:5px;cursor:pointer;flex:1}
.btn-x{background:none;border:1px solid var(--bord);color:var(--txt2);font-family:'Inter',sans-serif;font-size:12px;padding:8px 14px;border-radius:5px;cursor:pointer}
.btn-x:hover{border-color:var(--red);color:var(--red)}
.presets{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.preset{background:var(--surf2);border:1px solid var(--bord);color:var(--txt2);font-size:9px;padding:3px 8px;border-radius:3px;cursor:pointer;transition:.13s}
.preset:hover{border-color:var(--g);color:var(--g)}
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="live-dot"></div>
  <div>
    <div class="brand-name">Geo<span>Foot</span> Live</div>
    <div class="brand-sub">Mur d'écrans — signé Faye</div>
  </div>
  <div class="hdr-right">
    <span class="live-badge" id="liveBadge">7 live</span>
    <div class="grid-selector">
      <span style="font-size:9px;color:var(--txt2)">Grille :</span>
      <button class="gs-btn" onclick="setGrid(1,1)">1×1</button>
      <button class="gs-btn" onclick="setGrid(2,2)">2×2</button>
      <button class="gs-btn" onclick="setGrid(3,3)">3×3</button>
      <button class="gs-btn on" onclick="setGrid(4,4)">4×4</button>
      <button class="gs-btn" onclick="setGrid(5,5)">5×5</button>
      <button class="gs-btn" onclick="setGrid(6,6)">6×6</button>
    </div>
    <div style="width:1px;height:16px;background:var(--bord)"></div>
    <input class="stream-input" id="globalUrl" placeholder="Lien stream .m3u8 / YouTube / NOC...">
    <button class="add-btn" onclick="addStreamFromInput()">+ Ajouter</button>
    <button class="hdr-btn" onclick="openModal()">📋 M3U</button>
    <button class="hdr-btn" id="fullBtn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
  </div>
</header>

<div class="main">
  <!-- SIDEBAR MATCHS -->
  <aside class="sidebar">
    <div class="sb-ttl">🔴 En direct</div>
    <div id="matchList"></div>
  </aside>

  <!-- GRILLE VIDÉOS -->
  <div class="video-grid-wrap">
    <div class="grid-toolbar">
      <span class="gt-info">Grille <span id="gridInfo">4×4</span> — <span id="activeCount">0</span> streams actifs</span>
      <span style="font-size:9px;color:var(--txt2);margin-left:8px">Clic sur une cellule pour agrandir • Double-clic pour réduire</span>
      <button class="clear-btn" onclick="clearAll()">🗑 Tout effacer</button>
    </div>

    <div class="video-grid" id="videoGrid"></div>

    <div class="quick-urls">
      <span class="qu-ttl">📡 Accès rapide :</span>
      <button class="qu-btn" onclick="quickAdd('https://a11.sia-koora.live/ssc-1/index.m3u8','SSC Sports 1')">SSC 1</button>
      <button class="qu-btn" onclick="quickAdd('https://a11.sia-koora.live/ssc-2/index.m3u8','SSC Sports 2')">SSC 2</button>
      <button class="qu-btn" onclick="quickAdd('https://a11.sia-koora.live/ssc-3/index.m3u8','SSC Sports 3')">SSC 3</button>
      <button class="qu-btn" onclick="quickAdd('https://a11.sia-koora.live/bein1/index.m3u8','beIN SPORTS 1')">beIN 1</button>
      <button class="qu-btn" onclick="quickAdd('https://a11.sia-koora.live/bein2/index.m3u8','beIN SPORTS 2')">beIN 2</button>
      <button class="qu-btn" onclick="quickAdd('https://a11.sia-koora.live/bein3/index.m3u8','beIN SPORTS 3')">beIN 3</button>
      <button class="qu-btn" onclick="quickAdd('https://a11.sia-koora.live/canal1/index.m3u8','Canal+')">Canal+</button>
      <button class="qu-btn" onclick="openM3UBulk()">📂 Charger M3U</button>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>📡 Ajouter des streams</h3>
    <label>URL stream (une par ligne) :</label>
    <textarea id="bulkUrls" placeholder="https://example.com/stream1.m3u8
https://example.com/stream2.m3u8
https://youtube.com/watch?v=..."></textarea>
    <label>Sources M3U gratuites :</label>
    <div class="presets">
      <span class="preset" onclick="addPreset('https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8')">Free-TV M3U</span>
      <span class="preset" onclick="addPreset('https://iptv-org.github.io/iptv/categories/sports.m3u')">IPTV Sports</span>
      <span class="preset" onclick="addPreset('https://iptv-org.github.io/iptv/languages/ara.m3u')">IPTV Arabe</span>
      <span class="preset" onclick="addPreset('https://iptv-org.github.io/iptv/languages/fra.m3u')">IPTV Français</span>
    </div>
    <div class="modal-btns">
      <button class="btn-g" onclick="loadBulkStreams()">▶ Charger dans la grille</button>
      <button class="btn-x" onclick="closeModal()">Annuler</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════
// DONNÉES MATCHS EN DIRECT
// ══════════════════════════════════
const MATCHES = [
  {id:1,lg:'Premier League 🏴󠁧󠁢󠁥󠁮󠁧󠁿',h:'Man United',a:'Liverpool',sc:[3,2],st:'live',mn:71,ch:'beIN SPORTS 1'},
  {id:2,lg:'La Liga 🇪🇸',h:'Getafe CF',a:'Rayo Vallecano',sc:[0,2],st:'live',mn:87,ch:'beIN SPORTS 3'},
  {id:3,lg:'Bundesliga 🇩🇪',h:"B.Mönchengladbach",a:'Dortmund',sc:[0,1],st:'live',mn:55,ch:'Eurosport'},
  {id:4,lg:'Ligue 1 🇫🇷',h:'Lille OSC',a:'Le Havre',sc:[1,1],st:'live',mn:62,ch:'Canal+'},
  {id:5,lg:'CAN 2025 🌍',h:'Sénégal',a:'Maroc',sc:[1,0],st:'live',mn:72,ch:'Canal+ Afrique'},
  {id:6,lg:'CAF CL 🏆',h:'Al Ahly',a:'Espérance',sc:[1,1],st:'live',mn:60,ch:'beIN SPORTS 6'},
  {id:7,lg:'Qatar Stars 🇶🇦',h:'Al Sadd',a:'Al Duhail',sc:[0,0],st:'live',mn:38,ch:'Qatar TV'},
  {id:8,lg:'Brésil Série A 🇧🇷',h:'Palmeiras',a:'São Paulo',sc:[1,0],st:'live',mn:55,ch:'Globo'},
  {id:9,lg:'La Liga 🇪🇸',h:'Real Betis',a:'Real Oviedo',sc:[0,0],st:'upcoming',tm:'16:30',ch:'beIN SPORTS 4'},
  {id:10,lg:'Premier League 🏴󠁧󠁢󠁥󠁮󠁧󠁿',h:'Aston Villa',a:'Tottenham',sc:[0,0],st:'upcoming',tm:'18:00',ch:'Canal+'},
  {id:11,lg:'Ligue 1 🇫🇷',h:'Lyon',a:'Rennes',sc:[0,0],st:'upcoming',tm:'18:45',ch:'Canal+'},
  {id:12,lg:'Serie A 🇮🇹',h:'Inter Milano',a:'Parma',sc:[0,0],st:'upcoming',tm:'18:45',ch:'beIN SPORTS 5'},
];

// ══════════════════════════════════
// ÉTAT GRILLE
// ══════════════════════════════════
let gridCols = 4, gridRows = 4;
let cells = []; // Array de {url, name, hls, focused}
let hlsInstances = {};
let focusedCell = -1;

// ══════════════════════════════════
// INIT GRILLE
// ══════════════════════════════════
function initGrid() {
  const total = gridCols * gridRows;
  const grid = document.getElementById('videoGrid');
  grid.style.gridTemplateColumns = `repeat(${gridCols}, 1fr)`;
  grid.style.gridTemplateRows = `repeat(${gridRows}, 1fr)`;

  // Conserver les streams existants
  while (cells.length < total) cells.push(null);

  grid.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const cell = createCell(i);
    grid.appendChild(cell);
  }
  updateCount();
}

function createCell(idx) {
  const div = document.createElement('div');
  div.className = 'vcell' + (cells[idx] ? ' active' : ' empty');
  div.id = 'cell-' + idx;
  div.onclick = (e) => { if(!e.target.classList.contains('ca-btn')) focusCell(idx); };
  div.ondblclick = () => unfocusCell();

  if (cells[idx]) {
    // Cellule avec stream
    const c = cells[idx];
    div.innerHTML = `
      <div class="cell-loading" id="loading-${idx}"><div class="spinner"></div><div class="loading-txt">Chargement...</div></div>
      <video id="vid-${idx}" muted playsinline style="display:none"></video>
      <iframe id="frame-${idx}" style="display:none" allowfullscreen allow="autoplay;fullscreen"></iframe>
      <div class="cell-topbar"><span class="cell-ch">${c.name||'Stream'}</span></div>
      <div class="cell-overlay">
        <div class="cell-teams">${c.match ? c.match.h+' vs '+c.match.a : c.name||'Stream'}</div>
        ${c.match && c.match.st==='live' ? `<span class="cell-score">${c.match.sc[0]}-${c.match.sc[1]}</span><span class="cell-min"> ●${c.match.mn}'</span><span class="cell-live"> LIVE</span>` : ''}
      </div>
      <div class="cell-subtitle" id="sub-${idx}"></div>
      <div class="cell-actions">
        <button class="ca-btn" onclick="event.stopPropagation();muteCell(${idx})" title="Mute/Son">🔊</button>
        <button class="ca-btn" onclick="event.stopPropagation();reloadCell(${idx})" title="Recharger">↺</button>
        <button class="ca-btn del" onclick="event.stopPropagation();removeCell(${idx})" title="Supprimer">✕</button>
      </div>`;
    setTimeout(() => loadCellStream(idx), 100 * idx); // Décalage pour ne pas tout charger en même temps
  } else {
    // Cellule vide
    div.innerHTML = `
      <div class="empty-num">${idx+1}</div>
      <div class="empty-icon">📺</div>
      <div class="empty-txt">Cliquez sur un match<br>ou collez un lien</div>`;
    div.onclick = () => promptCell(idx);
  }
  return div;
}

// ══════════════════════════════════
// CHARGER STREAM DANS CELLULE
// ══════════════════════════════════
function loadCellStream(idx) {
  const c = cells[idx];
  if (!c) return;
  const url = c.url;

  // Nettoyer ancien HLS
  if (hlsInstances[idx]) {
    hlsInstances[idx].destroy();
    delete hlsInstances[idx];
  }

  const video = document.getElementById('vid-' + idx);
  const frame = document.getElementById('frame-' + idx);
  const loading = document.getElementById('loading-' + idx);

  // YouTube
  if (url.includes('youtube.com') || url.includes('youtu.be')) {
    let vid = '';
    if (url.includes('watch?v=')) vid = url.split('v=')[1].split('&')[0];
    else if (url.includes('youtu.be/')) vid = url.split('youtu.be/')[1].split('?')[0];
    if (vid) {
      frame.src = `https://www.youtube.com/embed/${vid}?autoplay=1&mute=1&rel=0`;
      frame.style.display = 'block';
      if (loading) loading.style.display = 'none';
      return;
    }
  }

  // M3U8 / HLS
  if (Hls.isSupported()) {
    const hls = new Hls({
      maxBufferLength: 30,
      maxMaxBufferLength: 60,
      enableWorker: true,
      lowLatencyMode: true,
      manifestLoadingMaxRetry: 4,
      levelLoadingMaxRetry: 4,
      fragLoadingMaxRetry: 4,
    });
    hlsInstances[idx] = hls;
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.muted = true;
      video.play().catch(() => {});
      video.style.display = 'block';
      if (loading) loading.style.display = 'none';
    });
    hls.on(Hls.Events.ERROR, (e, data) => {
      if (data.fatal) {
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
    video.muted = true;
    video.play().catch(() => {});
    video.style.display = 'block';
    if (loading) loading.style.display = 'none';
  } else {
    // Iframe fallback
    frame.src = url;
    frame.style.display = 'block';
    if (loading) loading.style.display = 'none';
  }
}

// ══════════════════════════════════
// AJOUTER STREAM
// ══════════════════════════════════
function addStream(url, name, matchData) {
  url = url.trim();
  if (!url) return;

  // Trouver première cellule vide
  const emptyIdx = cells.findIndex((c, i) => !c && i < gridCols * gridRows);
  if (emptyIdx === -1) {
    alert('La grille est pleine ! Agrandis la grille ou supprime un stream.');
    return;
  }

  cells[emptyIdx] = { url, name: name || url.split('/').pop(), match: matchData || null };
  const cell = document.getElementById('cell-' + emptyIdx);
  const newCell = createCell(emptyIdx);
  cell.replaceWith(newCell);
  updateCount();
  updateMatchList();
}

function addStreamFromInput() {
  const url = document.getElementById('globalUrl').value.trim();
  if (!url) return;
  addStream(url, url.split('/').pop().split('?')[0]);
  document.getElementById('globalUrl').value = '';
}

function quickAdd(url, name) {
  addStream(url, name, null);
}

function promptCell(idx) {
  const url = prompt(`URL stream pour la cellule ${idx+1} :\n(.m3u8, YouTube, iframe...)`);
  if (url && url.trim()) {
    cells[idx] = { url: url.trim(), name: url.split('/').pop().split('?')[0], match: null };
    const cell = document.getElementById('cell-' + idx);
    const newCell = createCell(idx);
    cell.replaceWith(newCell);
    updateCount();
  }
}

// ══════════════════════════════════
// CONTRÔLES CELLULE
// ══════════════════════════════════
function focusCell(idx) {
  if (focusedCell === idx) { unfocusCell(); return; }
  if (focusedCell >= 0) document.getElementById('cell-' + focusedCell)?.classList.remove('focused');
  focusedCell = idx;
  const cell = document.getElementById('cell-' + idx);
  if (cell && cells[idx]) {
    cell.classList.add('focused');
    // Activer le son sur la cellule focus
    const vid = document.getElementById('vid-' + idx);
    if (vid) vid.muted = false;
  }
}

function unfocusCell() {
  if (focusedCell >= 0) {
    const cell = document.getElementById('cell-' + focusedCell);
    if (cell) cell.classList.remove('focused');
    // Remute
    const vid = document.getElementById('vid-' + focusedCell);
    if (vid) vid.muted = true;
    focusedCell = -1;
  }
}

function muteCell(idx) {
  const vid = document.getElementById('vid-' + idx);
  if (vid) {
    vid.muted = !vid.muted;
    event.currentTarget.textContent = vid.muted ? '🔇' : '🔊';
  }
}

function reloadCell(idx) {
  if (cells[idx]) loadCellStream(idx);
}

function removeCell(idx) {
  if (hlsInstances[idx]) { hlsInstances[idx].destroy(); delete hlsInstances[idx]; }
  cells[idx] = null;
  if (focusedCell === idx) focusedCell = -1;
  const cell = document.getElementById('cell-' + idx);
  const newCell = createCell(idx);
  cell.replaceWith(newCell);
  updateCount();
  updateMatchList();
}

function clearAll() {
  if (!confirm('Effacer tous les streams ?')) return;
  Object.values(hlsInstances).forEach(h => h.destroy());
  hlsInstances = {};
  cells = cells.map(() => null);
  focusedCell = -1;
  initGrid();
  updateMatchList();
}

// ══════════════════════════════════
// GRILLE
// ══════════════════════════════════
function setGrid(cols, rows) {
  gridCols = cols; gridRows = rows;
  document.querySelectorAll('.gs-btn').forEach(b => b.classList.remove('on'));
  event.currentTarget.classList.add('on');
  document.getElementById('gridInfo').textContent = cols+'×'+rows;
  // Tronquer cells si on réduit
  const total = cols * rows;
  for (let i = total; i < cells.length; i++) {
    if (hlsInstances[i]) { hlsInstances[i].destroy(); delete hlsInstances[i]; }
    cells[i] = null;
  }
  cells = cells.slice(0, total);
  initGrid();
}

function updateCount() {
  const active = cells.filter(c => c !== null).length;
  document.getElementById('activeCount').textContent = active;
}

// ══════════════════════════════════
// LISTE MATCHS
// ══════════════════════════════════
function renderMatchList() {
  const list = document.getElementById('matchList');
  let h = '';
  const liveMatches = MATCHES.filter(m => m.st === 'live');
  const upcomingMatches = MATCHES.filter(m => m.st === 'upcoming');

  liveMatches.forEach(m => {
    const inGrid = cells.some(c => c && c.match && c.match.id === m.id);
    h += `<div class="match-item live-item${inGrid?' in-grid':''}">
      <div class="mi-league">${m.lg}</div>
      <div class="mi-teams">${m.h}<br>${m.a}</div>
      <div class="mi-score">${m.sc[0]} - ${m.sc[1]}</div>
      <div class="mi-footer">
        <div class="mi-live"><i></i> ${m.mn}'</div>
        <button class="mi-add${inGrid?' added':''}" onclick="addMatchToGrid(${m.id})">${inGrid?'✓ Ajouté':'+ Voir'}</button>
      </div>
    </div>`;
  });

  if (upcomingMatches.length) {
    h += `<div class="sb-ttl" style="margin-top:6px">📅 À venir</div>`;
    upcomingMatches.forEach(m => {
      h += `<div class="match-item">
        <div class="mi-league">${m.lg}</div>
        <div class="mi-teams">${m.h} vs ${m.a}</div>
        <div style="font-size:9px;color:var(--txt2);margin-top:2px">${m.tm} • ${m.ch}</div>
      </div>`;
    });
  }

  list.innerHTML = h;
  document.getElementById('liveBadge').textContent = liveMatches.length + ' live';
}

function addMatchToGrid(id) {
  const m = MATCHES.find(x => x.id === id);
  if (!m) return;
  // URL simulée basée sur la chaîne
  const chUrls = {
    'beIN SPORTS 1': 'https://a11.sia-koora.live/bein1/index.m3u8',
    'beIN SPORTS 2': 'https://a11.sia-koora.live/bein2/index.m3u8',
    'beIN SPORTS 3': 'https://a11.sia-koora.live/bein3/index.m3u8',
    'Canal+': 'https://a11.sia-koora.live/canal1/index.m3u8',
    'Canal+ Afrique': 'https://a11.sia-koora.live/canal-afrique/index.m3u8',
    'Eurosport': 'https://a11.sia-koora.live/eurosport/index.m3u8',
    'SSC Sports': 'https://a11.sia-koora.live/ssc-1/index.m3u8',
    'beIN SPORTS 6': 'https://a11.sia-koora.live/bein6/index.m3u8',
  };
  const url = chUrls[m.ch] || prompt(`URL stream pour ${m.h} vs ${m.a} :`);
  if (!url) return;
  addStream(url, m.ch, m);
  updateMatchList();
}

function updateMatchList() {
  renderMatchList();
}

// ══════════════════════════════════
// MODAL M3U BULK
// ══════════════════════════════════
function openModal() { document.getElementById('modalBg').classList.add('open'); }
function openM3UBulk() { document.getElementById('modalBg').classList.add('open'); }
function closeModal() { document.getElementById('modalBg').classList.remove('open'); }

function addPreset(url) {
  const ta = document.getElementById('bulkUrls');
  ta.value = (ta.value ? ta.value + '\n' : '') + url;
}

async function loadBulkStreams() {
  const lines = document.getElementById('bulkUrls').value.split('\n').map(l=>l.trim()).filter(l=>l);
  closeModal();
  for (const line of lines) {
    if (line.match(/\.(m3u|m3u8)$/i)) {
      // Playlist M3U — charger et extraire les streams
      try {
        const r = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(line)}`);
        const d = await r.json();
        const urls = (d.contents||'').split('\n').filter(l=>l.startsWith('http'));
        urls.slice(0, 6).forEach((u,i) => addStream(u, 'IPTV '+(i+1), null));
      } catch(e) {
        addStream(line, line.split('/').pop(), null);
      }
    } else {
      addStream(line, line.split('/').pop().split('?')[0], null);
    }
  }
}

// ══════════════════════════════════
// FULLSCREEN
// ══════════════════════════════════
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
    document.getElementById('fullBtn').textContent = '⊠ Quitter';
  } else {
    document.exitFullscreen();
    document.getElementById('fullBtn').textContent = '⛶ Fullscreen';
  }
}

// ══════════════════════════════════
// SIMULATION SCORES LIVE
// ══════════════════════════════════
setInterval(() => {
  MATCHES.filter(m => m.st === 'live').forEach(m => {
    if (m.mn < 90) m.mn++;
    if (Math.random() < 0.008) { Math.random() < .5 ? m.sc[0]++ : m.sc[1]++; }
  });
  renderMatchList();
  // Mettre à jour les overlays dans la grille
  cells.forEach((c, idx) => {
    if (c && c.match) {
      const m = MATCHES.find(x => x.id === c.match.id);
      if (m && m.st === 'live') {
        c.match.sc = m.sc;
        c.match.mn = m.mn;
        const overlay = document.querySelector(`#cell-${idx} .cell-overlay`);
        if (overlay) {
          overlay.innerHTML = `<div class="cell-teams">${m.h} vs ${m.a}</div>
            <span class="cell-score">${m.sc[0]}-${m.sc[1]}</span>
            <span class="cell-min"> ●${m.mn}'</span>
            <span class="cell-live"> LIVE</span>`;
        }
      }
    }
  });
}, 20000);

// Fermer modal
document.getElementById('modalBg').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') unfocusCell();
  if (e.key === 'f' || e.key === 'F') toggleFullscreen();
});

// INIT
initGrid();
renderMatchList();
</script>
</body>
</html>
